<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <!-- iOS: własny mechanizm instalacji standalone, manifest mu niepotrzebny -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flota 2.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Flota 2.0</title>
    <script>
      // Manifest musi wskazywać dokładnie na URL bieżącego kodu rejestracyjnego
      // (id + start_url), inaczej Chrome na Androidzie/desktopie nigdy nie zgłosi
      // prawdziwego standalone po instalacji — patrz CLAUDE.md. Wstrzykujemy go
      // więc dynamicznie, jak najwcześniej, zamiast trzymać jeden statyczny plik.
      // Bez zakotwiczenia na "/" na początku — działa też pod ścieżką bazową
      // (np. GitHub Pages w trybie symulacji, gdzie apka nie stoi w katalogu głównym).
      (function () {
        var m = window.location.pathname.match(/\/rejestracja\/([A-Za-z0-9]+)/);
        if (!m) return;
        var kod = m[1];
        var link = document.createElement("link");
        link.rel = "manifest";
        if ("true" === "true") {
          // Tryb symulacji (bez backendu, patrz .env.mock) — manifest budowany
          // lokalnie w przeglądarce jako data: URI, żeby dało się realnie
          // przetestować standalone install na Androidzie/desktopie bez
          // wystawiania żadnego serwera.
          var appRoot = window.location.href.replace(/rejestracja\/.*/, "");
          var manifest = {
            id: appRoot + "rejestracja/" + kod,
            name: "Flota 2.0 (symulacja)",
            short_name: "Flota 2.0",
            start_url: appRoot + "rejestracja/" + kod,
            scope: appRoot,
            display: "standalone",
            background_color: "#0d0f12",
            theme_color: "#0d0f12",
            icons: [
              { src: appRoot + "icons/icon-192.png", sizes: "192x192", type: "image/png" },
              { src: appRoot + "icons/icon-512.png", sizes: "512x512", type: "image/png" },
            ],
          };
          link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
        } else {
          link.href = "/api/manifest/" + kod + ".webmanifest";
        }
        document.head.appendChild(link);
      })();
    </script>
    <script type="module" crossorigin src="/flota2-symulacja/assets/index-DtVlNCAt.js"></script>
    <link rel="stylesheet" crossorigin href="/flota2-symulacja/assets/index-CP5mZLhL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
