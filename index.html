    <!-- iOS: własny mechanizm instalacji standalone, manifest mu niepotrzebny -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Flota 2.0</title>
    <script>
      // Manifest musi wskazywać dokładnie na URL bieżącego kodu rejestracyjnego
      // (id + start_url), inaczej Chrome na Androidzie/desktopie nigdy nie zgłosi
      // prawdziwego standalone po instalacji — patrz CLAUDE.md. Wstrzykujemy go
      // więc dynamicznie, jak najwcześniej, zamiast trzymać jeden statyczny plik.
      // Bez zakotwiczenia na "/" na początku — działa też pod ścieżką bazową
      // (np. GitHub Pages w trybie symulacji, gdzie apka nie stoi w katalogu głównym).
      (function () {
        var m = window.location.pathname.match(/\/rejestracja\/([A-Za-z0-9]+)/);
        if (!m) return;
        var kod = m[1];
        var link = document.createElement("link");
        link.rel = "manifest";
        if ("true" === "true") {
          // Tryb symulacji (bez backendu, patrz .env.mock) — manifest budowany
          // lokalnie w przeglądarce, per kod, jak w produkcji (start_url musi
          // wskazywać na /rejestracja/<kod>, inaczej ikona po instalacji
          // otwiera "/" i rejestracja nigdy się nie wykonuje — patrz CLAUDE.md).
          // UWAGA: manifest jako data: URI wygląda poprawnie (parsuje się,
          // ikony się ładują), ale realnie NIE uruchamia beforeinstallprompt
          // w Chrome (potwierdzone zgłoszeniami innych z tym samym problemem)
          // — dlatego Blob + URL.createObjectURL zamiast data:, to prawdziwy,
          // fetchowalny zasób z tego samego originu.
          var appRoot = window.location.href.replace(/rejestracja\/.*/, "");
          var manifest = {
            id: appRoot + "rejestracja/" + kod,
            name: "Flota 2.0 (symulacja)",
            short_name: "Flota 2.0",
            start_url: appRoot + "rejestracja/" + kod,
            scope: appRoot,
            display: "standalone",
            background_color: "#0d0f12",
            theme_color: "#0d0f12",
            icons: [
              { src: appRoot + "icons/icon-192.png", sizes: "192x192", type: "image/png" },
              { src: appRoot + "icons/icon-512.png", sizes: "512x512", type: "image/png" },
            ],
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
          link.href = URL.createObjectURL(blob);
        } else {
          link.href = "/api/manifest/" + kod + ".webmanifest";
        }
        document.head.appendChild(link);
      })();
    </script>
    <script>
      // Łapiemy beforeinstallprompt tu, jak najwcześniej, GLOBALNIE — nie w
      // komponencie React. Zdarzenie odpala się tylko raz na wczytanie strony
      // i jeśli nikt jeszcze nie słucha (np. React się jeszcze nie zamontował,
      // albo w trybie symulacji czeka na PIN), przepada bezpowrotnie. Chrome
      // może je wysłać niemal natychmiast, jeśli origin już ma wystarczające
      // "zaangażowanie" z wcześniejszych wizyt — czekanie z rejestracją
      // nasłuchu do momentu zamontowania InstallGate.tsx nie jest bezpieczne.
      window.__deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
