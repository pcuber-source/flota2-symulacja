<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <!-- iOS: własny mechanizm instalacji standalone, manifest mu niepotrzebny -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flota 2.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Flota 2.0</title>
    <script>
      // Manifest musi wskazywać dokładnie na URL bieżącego kodu rejestracyjnego
      // (id + start_url), inaczej Chrome na Androidzie/desktopie nigdy nie zgłosi
      // prawdziwego standalone po instalacji — patrz CLAUDE.md. Wstrzykujemy go
      // więc dynamicznie, jak najwcześniej, zamiast trzymać jeden statyczny plik.
      // Bez zakotwiczenia na "/" na początku — działa też pod ścieżką bazową
      // (np. GitHub Pages w trybie symulacji, gdzie apka nie stoi w katalogu głównym).
      (function () {
        var m = window.location.pathname.match(/\/rejestracja\/([A-Za-z0-9]+)/);
        if (!m) return;
        var kod = m[1];
        var link = document.createElement("link");
        link.rel = "manifest";
        if ("true" === "true") {
          // Tryb symulacji (bez backendu, patrz .env.mock) — jeden statyczny
          // plik manifestu zamiast per-kodowego. UWAGA: manifest jako data:
          // URI wygląda poprawnie (parsuje się, ikony się ładują), ale
          // realnie NIE uruchamia beforeinstallprompt w Chrome (potwierdzone
          // zgłoszeniami innych osób z tym samym problemem) — dlatego tu
          // musi być prawdziwy, fetchowalny plik, nie data: URI. W trybie
          // symulacji i tak nie ma prawdziwych jednorazowych kodów, więc
          // jeden wspólny manifest wystarczy.
          var appRoot = window.location.href.replace(/rejestracja\/.*/, "");
          link.href = appRoot + "manifest.mock.json";
        } else {
          link.href = "/api/manifest/" + kod + ".webmanifest";
        }
        document.head.appendChild(link);
      })();
    </script>
    <script type="module" crossorigin src="/flota2-symulacja/assets/index-DWDJqUA8.js"></script>
    <link rel="stylesheet" crossorigin href="/flota2-symulacja/assets/index-CP5mZLhL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
